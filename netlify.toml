[build]
  command = "npx prisma db push --skip-generate && npx prisma generate && node prisma/seed.mjs && npx next build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
  DATABASE_URL = "file:./dev.db"
  JWT_SECRET = "ecogen-super-secret-key-2026-production"
